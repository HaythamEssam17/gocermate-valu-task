name: grocermate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  provider: ^6.1.2
  dio: ^5.11.1
  dio_logger_plus: ^1.3.0
  dartz: ^0.10.1
  get_it: ^9.3.0
  go_router: ^18.1.4
  equatable: ^3.0.0
  lucide_icons_flutter: ^4.0.3
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.7
  multi_dropdown: ^4.0.0
  flutter_native_splash: ^2.4.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.2
  dart_bloc_concurrency: ^2.0.1
  another_flushbar: ^2.2.4

  uuid: ^4.6.0

  material_ui: any
  cupertino_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/mock/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

flutter_native_splash:
  image: assets/images/logo-grocermate.jpg
  color: "#FFFFFF"
  fullscreen: true
  android_12:
    color: "#FFFFFF"
